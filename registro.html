<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrarse | MindCalm</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
        rel="stylesheet">

    <link rel="stylesheet" href="css/registro.css">
</head>


<body>

    <main class="pagina-registro">

        <span class="nube-decorativa nube-1"></span>
        <span class="nube-decorativa nube-2"></span>


        <section class="tarjeta-registro">

            <nav class="regresar">
                <a href="subHome.html">
                    <span class="material-symbols-outlined">
                        arrow_back
                    </span>
                    Regresar
                </a>
            </nav>

            <header class="encabezado-registro">

                <article class="logo">

                    <img src="img/logo2.png" width="100" height="100">
                </article>


                <h1>Crear tu cuenta</h1>

                <p>
                    Queremos conocerte un poco mejor
                    <br>
                    para acompañarte en tu bienestar.
                </p>

            </header>

            <form class="formulario">                

                <label for="nombre">
                    Nombre completo
                </label>

                <section class="campo">
                    <span class="material-symbols-outlined">
                        person
                    </span>
                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="Escribe tu nombre completo"
                        required>
                </section>

                <label for="edad"> Edad</label>
                <section class="campo">
                    <span class="material-symbols-outlined">calendar_month</span>
                        <input type="number" id="edad" name="edad" placeholder="Ej. 20" min="1" max="120" required>
                </section>



                <label for="correo">
                    Correo electrinico
                </label>
                <section class="campo">
                    <span class="material-symbols-outlined"> mail</span>
                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="ejemplo@correo.com"
                        required>
                </section>

                <label for="password">  Contraseña</label>
                <section class="campo">

                    <span class="material-symbols-outlined">  lock</span>

                    <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" minlength="8" required>
                    <button type="button" class="ver-password">
                        <span class="material-symbols-outlined"> visibility</span>
                    </button>
                </section>

             <label for="confirmar"> Confirmar contraseña</label>

                <section class="campo">
                    <span class="material-symbols-outlined">lock</span>
                    <input type="password" id="confirmar" name="confirmar" placeholder="Repite tu contraseña" minlength="8" required>
                    <button type="button" class="ver-password">
                    <span class="material-symbols-outlined"> visibility</span>
                    </button>
                </section>
             </label>

                <a href="inicioS.html"class="boton-registro">
                    Crear cuenta
                    <span class="material-symbols-outlined" aria-hidden="true">arrow_forward</span>
                </button></a>
            </form>

            <footer class="iniciar">
                <p>
                    ¿Ya tienes una cuenta?
                </p>

                <a href="inicioS.html">
                    Iniciar sesion
                </a>
            </footer>
        </section>
    </main>
</body>
</html>
