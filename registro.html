<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrarse | MindCalm</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Google Symbols -->
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/registro.css">

</head>


<body>

    <main class="pagina-registro">

        <!-- Decoraciones -->

        <span class="nube-decorativa nube-1"></span>
        <span class="nube-decorativa nube-2"></span>


        <section class="tarjeta-registro">

            <!-- Regresar -->

            <nav class="regresar">

                <a href="index.html">

                    <span class="material-symbols-outlined">
                        arrow_back
                    </span>

                    Regresar

                </a>

            </nav>


            <!-- Encabezado -->

            <header class="encabezado-registro">

                <article class="logo">

                    <img src="img/Logo.png" width="100" height="100">
                </article>


                <h1>Crear tu cuenta</h1>

                <p>
                    Queremos conocerte un poco mejor
                    <br>
                    para acompañarte en tu bienestar.
                </p>

            </header>


            <!-- FORMULARIO -->

            <form class="formulario">


                <!-- NOMBRE -->

                <label for="nombre">
                    Nombre completo
                </label>

                <section class="campo">

                    <span class="material-symbols-outlined">
                        person
                    </span>

                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="Escribe tu nombre completo"
                        required>

                </section>


                <!-- EDAD -->

                <label for="edad">
                    Edad
                </label>

                <section class="campo">

                    <span class="material-symbols-outlined">
                        calendar_month
                    </span>

                    <input
                        type="number"
                        id="edad"
                        name="edad"
                        placeholder="Ej. 20"
                        min="1"
                        max="120"
                        required>

                </section>


                <!-- CORREO -->

                <label for="correo">
                    Correo electrónico
                </label>

                <section class="campo">

                    <span class="material-symbols-outlined">
                        mail
                    </span>

                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="ejemplo@correo.com"
                        required>

                </section>


                <!-- CONTRASEÑA -->

                <label for="password">
                    Contraseña
                </label>

                <section class="campo">

                    <span class="material-symbols-outlined">
                        lock
                    </span>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Mínimo 8 caracteres"
                        minlength="8"
                        required>

                    <button
                        type="button"
                        class="ver-password">

                        <span class="material-symbols-outlined">
                            visibility
                        </span>

                    </button>

                </section>


                <!-- CONFIRMAR CONTRASEÑA -->

                <label for="confirmar">
                    Confirmar contraseña
                </label>

                <section class="campo">

                    <span class="material-symbols-outlined">
                        lock
                    </span>

                    <input
                        type="password"
                        id="confirmar"
                        name="confirmar"
                        placeholder="Repite tu contraseña"
                        minlength="8"
                        required>

                    <button
                        type="button"
                        class="ver-password">

                        <span class="material-symbols-outlined">
                            visibility
                        </span>

                    </button>

                </section>


                <!-- TÉRMINOS -->

                <label class="terminos">

                    <input
                        type="checkbox"
                        required>

                    <span>
                        Acepto los
                        <a href="#">
                            términos y condiciones
                        </a>
                    </span>

                </label>


                <!-- BOTÓN -->

                <button
                    type="submit"
                    class="boton-registro">

                    Crear cuenta

                    <span class="material-symbols-outlined">
                        arrow_forward
                    </span>

                </button>


            </form>


            <!-- INICIAR SESIÓN -->

            <footer class="iniciar">

                <p>
                    ¿Ya tienes una cuenta?
                </p>

                <a href="inicio-sesion.html">
                    Iniciar sesión
                </a>

            </footer>


        </section>

    </main>

</body>

</html>
