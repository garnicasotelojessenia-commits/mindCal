<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Respiración</title>

    <!-- TIPOGRAFÍA -->
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800"
        rel="stylesheet">

    <!-- ICONOS -->
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/respiracion.css">
    

</head>


<body>

    <main id="ejercicio-respiracion">

        <!-- icon regresar -->

        <a href="ejercicios.html" id="boton-regresar">

            <span class="material-symbols-outlined"> arrow_back </span>
        </a>


        <!-- inf ejercicio -->

        <section id="informacion-ejercicio">
            <h1>Inhala</h1>
            <p>4 segundos</p>
        </section>


        <!-- Nube -->

        <section id="circulo-respiracion">
            <img
                src="img/nube.png"
                alt="Nube para ejercicio de respiración">
        </section>


        <!-- Indicador -->

        <span id="indicador-respiracion"></span>

        <!-- Boton para pausar -->

        <button id="boton-pausar">

            <span class="material-symbols-outlined">pause</span>
            Pausar
        </button>
     </main>

</body>

</html>
